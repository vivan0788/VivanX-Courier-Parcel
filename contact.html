<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us | VivanX Courier Parcel</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div id="scroll-progress"></div>

  <nav class="navbar">
    <a href="index.html" class="logo">📦 VivanX</a>
    <ul class="nav-links" id="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="tracking.html">Tracking</a></li>
      <li><a href="contact.html" class="active">Contact</a></li>
    </ul>
    <button class="theme-toggle" id="theme-toggle">🌙</button>
  </nav>

  <section class="section" style="max-width: 600px; margin: 0 auto;">
    <h1 class="section-title">Get in Touch</h1>
    
    <form action="https://formspree.io/f/xvzejzpe" method="POST" class="card" style="display: flex; flex-direction: column; gap: 1rem;">
      <div>
        <label style="display:block; margin-bottom: 0.5rem;">Full Name</label>
        <input type="text" name="name" required style="width:100%; padding: 0.8rem; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-main); color: var(--text-main);">
      </div>
      <div>
        <label style="display:block; margin-bottom: 0.5rem;">Email Address</label>
        <input type="email" name="email" required style="width:100%; padding: 0.8rem; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-main); color: var(--text-main);">
      </div>
      <div>
        <label style="display:block; margin-bottom: 0.5rem;">Phone Number</label>
        <input type="tel" name="phone" style="width:100%; padding: 0.8rem; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-main); color: var(--text-main);">
      </div>
      <div>
        <label style="display:block; margin-bottom: 0.5rem;">Message</label>
        <textarea name="message" rows="5" required style="width:100%; padding: 0.8rem; border-radius: 8px; border: 1px solid var(--border-color); background: var(--bg-main); color: var(--text-main);"></textarea>
      </div>
      <button type="submit" class="btn btn-primary" style="margin-top: 1rem;">Send Message</button>
    </form>
  </section>

  <footer>
    <div class="footer-bottom">
      <p>&copy; 2026 VivanX Courier Parcel. All Rights Reserved.</p>
    </div>
  </footer>

  <script src="js/main.js"></script>
</body>
</html>
